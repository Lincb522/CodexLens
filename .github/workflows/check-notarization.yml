name: Check notarization

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization submission ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check Apple notarization status
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ ! "$SUBMISSION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid submission ID." >&2
            exit 2
          fi

          for name in KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing notarization input: $name" >&2
              exit 2
            fi
          done

          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$PRIVATE_KEY" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          info="$(xcrun notarytool info "$SUBMISSION_ID" \
            --key "$KEY_PATH" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --output-format json)"

          status="$(
            printf '%s' "$info" \
              | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])'
          )"
          created="$(
            printf '%s' "$info" \
              | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["createdDate"])'
          )"

          echo "Submission: $SUBMISSION_ID"
          echo "Created: $created"
          echo "Status: $status"

          {
            echo "## Apple notarization"
            echo
            echo "- Submission: \`$SUBMISSION_ID\`"
            echo "- Created: \`$created\`"
            echo "- Status: **$status**"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            Invalid|Rejected)
              LOG_PATH="$RUNNER_TEMP/notarization-log.json"
              xcrun notarytool log "$SUBMISSION_ID" "$LOG_PATH" \
                --key "$KEY_PATH" \
                --key-id "$KEY_ID" \
                --issuer "$ISSUER_ID"

              /usr/bin/python3 - "$LOG_PATH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          log_path, summary_path = sys.argv[1:]
          with open(log_path, encoding="utf-8") as source:
              report = json.load(source)

          summary = report.get("statusSummary", "No status summary returned.")
          issues = report.get("issues") or []
          print(f"Summary: {summary}")
          for issue in issues:
              severity = issue.get("severity", "unknown")
              message = issue.get("message", "Unknown issue")
              path = issue.get("path")
              print(f"Issue [{severity}]: {message}")
              if path:
                  print(f"Path: {path}")

          with open(summary_path, "a", encoding="utf-8") as summary_file:
              summary_file.write(f"- Summary: {summary}\n")
              if issues:
                  summary_file.write("\n### Issues\n")
              for issue in issues:
                  severity = issue.get("severity", "unknown")
                  message = issue.get("message", "Unknown issue")
                  path = issue.get("path")
                  summary_file.write(f"- **{severity}**: {message}\n")
                  if path:
                      summary_file.write(f"  - Path: `{path}`\n")
          PY
              ;;
          esac
