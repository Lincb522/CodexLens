name: CodexTokenLedger
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
options:
  bundleIdPrefix: com.tokenledger
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CodexTokenLedger:
    type: application
    platform: macOS
    sources:
      - path: Sources/CodexTokenLedger
        excludes:
          - Resources
      - path: Sources/CodexTokenLedger/Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenledger.CodexTokenLedger
        MARKETING_VERSION: 2.1.8
        CURRENT_PROJECT_VERSION: 30
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - CodexTokenLedgerTests
  CodexTokenLedgerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CodexTokenLedgerTests
    dependencies:
      - target: CodexTokenLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenledger.CodexTokenLedgerTests
        GENERATE_INFOPLIST_FILE: YES
